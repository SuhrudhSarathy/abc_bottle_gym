[project]
name = "abc-bottle-gym"
version = "0.1.0"
description = "Standalone Gymnasium MuJoCo environment: bimanual arms put bottles in a bin (adapted from the ABC project)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "mujoco>=3.1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
video = [
    "imageio[ffmpeg]>=2.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abc_bottle_gym"]

[tool.hatch.build.targets.sdist]
include = ["src/abc_bottle_gym/**", "README.md", "LICENSE", "NOTICE"]
