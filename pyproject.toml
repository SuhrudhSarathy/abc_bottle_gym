[project]
name = "abc-bottle-gym"
version = "0.1.0"
description = "Standalone Gymnasium MuJoCo environment: bimanual arms put bottles in a bin (adapted from the ABC project)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    # Pinned to the exact combination the upstream ABC project tests against
    # (its uv.lock). mujoco-warp/warp-lang are versioned in lockstep with each
    # other and with mujoco; drifting mujoco-warp ahead of warp-lang (e.g.
    # mujoco-warp 3.13.0 against warp-lang 1.17.0) hits a kernel-metadata bug
    # in warp's caching of mujoco-warp's dynamically-built collision kernels
    # (KeyError: '..._smem_bytes' from warp/_src/context.py) on repeated
    # model rebuilds -- exactly what this env does every reset().
    "mujoco==3.12.0",
    "mujoco-warp==3.12.0",
    "warp-lang==1.17.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
video = [
    "imageio[ffmpeg]>=2.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abc_bottle_gym"]

[tool.hatch.build.targets.sdist]
include = ["src/abc_bottle_gym/**", "README.md", "LICENSE", "NOTICE"]
